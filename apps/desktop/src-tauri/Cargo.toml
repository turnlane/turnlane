[package]
name = "turnlane-desktop"
version = "0.0.0"
description = "Turnlane desktop shell (a thin client of turnlaned)"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "turnlane"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSArray", "NSSet", "NSLocale", "NSError", "NSObject", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationSettings", "UNNotificationTrigger", "UNNotificationAction", "UNNotificationCategory", "block2"] }

[features]
# tauri build / tauri dev が付ける
custom-protocol = ["tauri/custom-protocol"]
# お試し版だけ: Safari の開発メニューから WKWebView を調べられるようにする（setInspectable。release でも効く）。
# 既定ではオフ。`bun run build:app --debug-webview` が付ける
inspector = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
